[project]
name = "lumen"
version = "0.1.0"
description = "Lumen — explorable webapp distilled from science YouTube videos."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp>=2025.1.15",
    "youtube-transcript-api>=0.6.3",
    "requests>=2.32.0",
    "jsonschema>=4.23.0",
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=3.3.0",
    "pydantic>=2.10.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "types-requests>=2.32.0",
    "types-jsonschema>=4.23.0",
]

[tool.uv]
package = false

[tool.mypy]
strict = true
python_version = "3.12"
files = ["scripts/lib"]

[[tool.mypy.overrides]]
module = ["sqlite_vec"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
